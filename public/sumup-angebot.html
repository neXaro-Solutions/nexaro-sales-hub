<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#202421"><title>SumUp-Angebot / SumUp Offer | neXaro Solutions</title><link rel="stylesheet" href="./nexaro-public.css"></head><body><main class="nx-shell"><section class="nx-card"><header class="nx-brandbar"><div><div class="nx-wordmark"><span class="nx-orange">neXaro</span> Solutions</div><div class="nx-kicker">People · Payment · Products · Progress</div></div></header><div class="nx-content" id="app"><span class="nx-eyebrow">Persönliches Angebot</span><h1>Ihr Angebot wird geladen …</h1><div class="nx-loader">Einen Moment bitte.</div></div><footer class="nx-footer">neXaro Solutions · Kirchstraße 1A · 15757 Halbe · <a href="https://www.nexaro-solutions.de/">nexaro-solutions.de</a></footer></section></main><script>
const API='https://hbuqzdmjqvgybwohfnqy.supabase.co/functions/v1/nx-offer-accept';
const q=new URLSearchParams(location.search),token=q.get('token')||'',language=(q.get('lang')||localStorage.getItem('nexaro-language')||'de')==='en'?'en':'de',en=language==='en';
localStorage.setItem('nexaro-language',language);document.documentElement.lang=language;
const app=document.getElementById('app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const euro=v=>new Intl.NumberFormat(en?'en-GB':'de-DE',{style:'currency',currency:'EUR'}).format(Number(v)||0);
const t=(de,enText)=>en?enText:de;
async function load(){
 if(!token){app.innerHTML='<div class="nx-error">'+t('Der Angebotslink ist unvollständig.','The offer link is incomplete.')+'</div>';return}
 try{
  const r=await fetch(API+'?api=1&lang='+language+'&token='+encodeURIComponent(token),{headers:{accept:'application/json'}});
  const d=await r.json();if(!r.ok)throw Error(d.error||t('Angebot konnte nicht geladen werden.','The offer could not be loaded.'));
  if(d.accepted){app.innerHTML='<div class="nx-ok">✓</div><span class="nx-eyebrow">'+t('Bereits bestätigt','Already confirmed')+'</span><h1>'+t('Angebot angenommen.','Offer accepted.')+'</h1><p>'+t('Das Angebot ','Offer ')+'<strong>'+esc(d.offer.number)+'</strong> '+t('wurde bereits erfolgreich bestätigt.','has already been confirmed successfully.')+'</p>';return}
  const lines=(d.offer.lines||[]).map(x=>'<div class="nx-row"><span>'+esc(x.name)+' × '+esc(x.quantity)+'</span><strong>'+esc(euro(Number(x.price)*Number(x.quantity)))+'</strong></div>').join('');
  app.innerHTML='<span class="nx-eyebrow">'+t('Persönliches SumUp-Angebot','Personal SumUp offer')+'</span><h1>'+t('Alles auf einen Blick.','Everything at a glance.')+'</h1><p class="nx-muted">'+t('Angebot ','Offer ')+'<strong>'+esc(d.offer.number)+'</strong> '+t('für ','for ')+'<strong>'+esc(d.customer.company)+'</strong></p><div class="nx-box">'+lines+'<p class="nx-total">'+t('Gesamt: ','Total: ')+esc(euro(d.offer.gross))+'</p></div><div class="nx-box nx-orange-box"><strong>'+t('Wer ist Ihr Vertragspartner?','Who is your contractual partner?')+'</strong><p>'+t('neXaro berät und vermittelt Ihnen diese SumUp-Lösung als autorisierter Vertriebspartner. Der Vertrag über SumUp-Produkte und -Leistungen wird im anschließenden Abschlussprozess mit SumUp geschlossen.','neXaro advises on and arranges this SumUp solution as an authorised sales partner. The contract for SumUp products and services is concluded with SumUp during the subsequent completion process.')+'</p></div><form id="f"><label class="nx-check"><input type="checkbox" id="business" required><span>'+t('Ich bestätige, dass ich im Rahmen meiner gewerblichen oder selbstständigen beruflichen Tätigkeit handle.','I confirm that I am acting in the course of my business or self-employed professional activity.')+'</span></label><label class="nx-check"><input type="checkbox" id="transfer" required><span>'+t('Ich nehme das Angebot an und beauftrage neXaro, meine angegebenen Unternehmens- und Kontaktdaten zum Zweck der Einrichtung meines SumUp-Vorgangs bzw. der Vorbereitung des SumUp-Vertragsabschlusses an SumUp zu übermitteln.','I accept the offer and instruct neXaro to transfer the company and contact data I provided to SumUp for the purpose of setting up my SumUp process and preparing the SumUp contract.')+'</span></label><label class="nx-check"><input type="checkbox" id="continueConfirm" required><span>'+t('Ich möchte auf Grundlage dieses Angebots mit dem SumUp-Abschluss fortfahren.','I would like to continue with the SumUp completion based on this offer.')+'</span></label><button class="nx-btn" id="submit" type="submit">'+t('Angebot annehmen &amp; SumUp-Einrichtung starten','Accept offer &amp; start SumUp setup')+'</button></form><p class="nx-small">'+t('Ihre Bestätigung wird mit Angebotsnummer, Angebotsversion sowie Datum und Uhrzeit dokumentiert. Maßgeblich für den anschließenden SumUp-Vertrag sind die dort bereitgestellten Vertragsbedingungen.','Your confirmation is documented with the offer number, offer version, date and time. The contractual terms provided by SumUp govern the subsequent SumUp contract.')+'</p>';
  document.getElementById('f').addEventListener('submit',accept);
 }catch(e){app.innerHTML='<div class="nx-error">'+esc(e.message||t('Fehler beim Laden des Angebots.','Error loading the offer.'))+'</div>'}
}
async function accept(e){
 e.preventDefault();const b=document.getElementById('submit'),businessBox=document.getElementById('business'),transferBox=document.getElementById('transfer'),continueBox=document.getElementById('continueConfirm');
 b.disabled=true;b.textContent=t('Wird bestätigt …','Confirming …');
 try{
  const r=await fetch(API+'?api=1&lang='+language,{method:'POST',headers:{'content-type':'application/json','accept':'application/json'},body:JSON.stringify({token,business:businessBox.checked,transfer:transferBox.checked,continue:continueBox.checked,language})});
  const d=await r.json();if(!r.ok)throw Error(d.error||t('Annahme konnte nicht gespeichert werden.','Acceptance could not be saved.'));
  app.innerHTML='<div class="nx-ok">✓</div><span class="nx-eyebrow">'+t('Erfolgreich bestätigt','Successfully confirmed')+'</span><h1>'+t('Vielen Dank.','Thank you.')+'</h1><p>'+t('Ihr SumUp-Angebot ist angenommen. Wir können jetzt Ihren SumUp-Vorgang anlegen.','Your SumUp offer has been accepted. We can now set up your SumUp process.')+'</p><div class="nx-box"><div class="nx-row"><span>'+t('Angebot','Offer')+'</span><strong>'+esc(d.offerNumber)+'</strong></div><div class="nx-row"><span>'+t('Unternehmen','Company')+'</span><strong>'+esc(d.company)+'</strong></div><div class="nx-row"><span>'+t('Transaktions-ID','Transaction ID')+'</span><strong>'+esc(d.transactionId)+'</strong></div></div><p class="nx-muted">'+esc(d.mailSent?t('Eine Bestätigung wurde an Ihre E-Mail-Adresse gesendet.','A confirmation has been sent to your email address.'):t('Ihre Annahme wurde gespeichert. Die E-Mail-Bestätigung konnte aktuell nicht zugestellt werden; Ihre Annahme bleibt dennoch gültig.','Your acceptance has been saved. The email confirmation could not be delivered at this time; your acceptance remains valid.'))+'</p>';
 }catch(e2){b.disabled=false;b.textContent=t('Angebot annehmen & SumUp-Einrichtung starten','Accept offer & start SumUp setup');alert(e2.message||t('Fehler bei der Annahme.','Error accepting the offer.'))}
}
load();
</script><script src="./nx-language.js?v=20261007-final1" defer></script></body></html>

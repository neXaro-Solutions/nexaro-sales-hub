<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SumUp-Angebot annehmen | neXaro</title><style>body{margin:0;background:#f5f7f5;color:#18201d;font:16px/1.55 system-ui,-apple-system,sans-serif}.wrap{max-width:760px;margin:36px auto;padding:20px}.card{background:#fff;border-radius:20px;padding:28px;box-shadow:0 12px 40px #00000012}.brand{font-size:26px;font-weight:800}.accent{color:#e96918}h1{font-size:28px;margin:16px 0 8px}.muted{color:#65706b}.box{background:#f6f9f6;border:1px solid #dfe7e1;border-radius:14px;padding:16px;margin:18px 0}.sum{font-size:22px;font-weight:800}.check{display:flex;gap:10px;margin:14px 0}.check input{margin-top:5px}.btn{display:block;width:100%;border:0;border-radius:12px;padding:15px 18px;background:#18201d;color:#fff;font-weight:800;font-size:16px;cursor:pointer;margin-top:20px}.btn:disabled{opacity:.55}.small{font-size:13px;color:#65706b}.ok{font-size:48px}.error{color:#9f1d1d;background:#fff0f0;border:1px solid #f2c8c8;border-radius:12px;padding:14px}.row{display:flex;justify-content:space-between;gap:16px;padding:8px 0;border-bottom:1px solid #e7ece8}</style></head><body><div class="wrap"><div class="card"><div class="brand"><span class="accent">neXaro</span> Solutions</div><div id="app"><h1>Angebot wird geladen …</h1></div></div></div><script>const API='https://hbuqzdmjqvgybwohfnqy.supabase.co/functions/v1/nx-offer-accept';const q=new URLSearchParams(location.search),token=q.get('token')||'';const app=document.getElementById('app');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const euro=v=>new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR'}).format(Number(v)||0);async function load(){if(!token){app.innerHTML='<div class="error">Der Angebotslink ist unvollständig.</div>';return}try{const r=await fetch(API+'?api=1&token='+encodeURIComponent(token),{headers:{accept:'application/json'}});const d=await r.json();if(!r.ok)throw Error(d.error||'Angebot konnte nicht geladen werden.');if(d.accepted){app.innerHTML='<div class="ok">✓</div><h1>Angebot bereits angenommen</h1><p>Das Angebot <strong>'+esc(d.offer.number)+'</strong> wurde bereits bestätigt.</p>';return}const lines=(d.offer.lines||[]).map(x=>'<div class="row"><span>'+esc(x.name)+' × '+esc(x.quantity)+'</span><strong>'+esc(euro(Number(x.price)*Number(x.quantity)))+'</strong></div>').join('');app.innerHTML='<h1>Ihr persönliches SumUp-Angebot</h1><p class="muted">Angebot '+esc(d.offer.number)+' für '+esc(d.customer.company)+'</p><div class="box">'+lines+'<p class="sum">Gesamt: '+esc(euro(d.offer.gross))+'</p></div><div class="box"><strong>Wer ist Ihr Vertragspartner?</strong><p>neXaro berät und vermittelt Ihnen diese SumUp-Lösung als autorisierter Vertriebspartner. Der Vertrag über SumUp-Produkte und -Leistungen wird im anschließenden Abschlussprozess mit SumUp geschlossen.</p></div><form id="f"><label class="check"><input type="checkbox" id="business" required><span>Ich bestätige, dass ich im Rahmen meiner gewerblichen oder selbstständigen beruflichen Tätigkeit handle.</span></label><label class="check"><input type="checkbox" id="transfer" required><span>Ich nehme das Angebot an und beauftrage neXaro, meine angegebenen Unternehmens- und Kontaktdaten zum Zweck der Einrichtung meines SumUp-Vorgangs bzw. der Vorbereitung des SumUp-Vertragsabschlusses an SumUp zu übermitteln.</span></label><label class="check"><input type="checkbox" id="continueConfirm" required><span>Ich möchte auf Grundlage dieses Angebots mit dem SumUp-Abschluss fortfahren.</span></label><button class="btn" id="submit" type="submit">Angebot annehmen &amp; SumUp-Einrichtung starten</button></form><p class="small">Ihre Bestätigung wird mit Angebotsnummer, Angebotsversion sowie Datum und Uhrzeit dokumentiert. Maßgeblich für den anschließenden SumUp-Vertrag sind die dort bereitgestellten Vertragsbedingungen.</p>';document.getElementById('f').addEventListener('submit',accept)}catch(e){app.innerHTML='<div class="error">'+esc(e.message||'Fehler beim Laden des Angebots.')+'</div>'}}async function accept(e){e.preventDefault();const b=document.getElementById('submit');const businessBox=document.getElementById('business');const transferBox=document.getElementById('transfer');const continueBox=document.getElementById('continueConfirm');b.disabled=true;b.textContent='Wird bestätigt …';try{const r=await fetch(API+'?api=1',{method:'POST',headers:{'content-type':'application/json','accept':'application/json'},body:JSON.stringify({token,business:businessBox.checked,transfer:transferBox.checked,continue:continueBox.checked})});const d=await r.json();if(!r.ok)throw Error(d.error||'Annahme konnte nicht gespeichert werden.');app.innerHTML='<div class="ok">✓</div><h1>Vielen Dank – Ihr Angebot ist angenommen.</h1><p>Wir haben Ihre Freigabe erhalten und können jetzt Ihren SumUp-Vorgang anlegen.</p><div class="box"><strong>Angebot:</strong> '+esc(d.offerNumber)+'<br><strong>Unternehmen:</strong> '+esc(d.company)+'<br><strong>Transaktions-ID:</strong> '+esc(d.transactionId)+'</div><p>'+esc(d.mailSent?'Eine Bestätigung wurde an Ihre E-Mail-Adresse gesendet.':'Ihre Annahme wurde gespeichert. Die E-Mail-Bestätigung konnte aktuell nicht zugestellt werden; Ihre Annahme bleibt dennoch gültig.')+'</p>'}catch(e2){b.disabled=false;b.textContent='Angebot annehmen & SumUp-Einrichtung starten';alert(e2.message||'Fehler bei der Annahme.')}}load();</script></body></html>
